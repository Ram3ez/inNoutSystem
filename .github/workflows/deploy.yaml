name: CI/CD to GHCR

on:
  push:
    branches: ["main"]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # This step converts the repo name to lowercase
      - name: Prepare Lowercase Image Name
        run: |
          echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            NEXT_PUBLIC_APPWRITE_ENDPOINT=${{ secrets.NEXT_PUBLIC_APPWRITE_ENDPOINT }}
            NEXT_PUBLIC_APPWRITE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_APPWRITE_PROJECT_ID }}
            NEXT_PUBLIC_DISABLE_REALTIME=${{ secrets.NEXT_PUBLIC_DISABLE_REALTIME }}

      # Optional: Keep only the latest 5 versions to save GHCR storage
      - name: Delete old image versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: 'hostelsystemweb'
          package-type: 'container'
          min-versions-to-keep: 5
          delete-only-untagged-versions: 'false'
